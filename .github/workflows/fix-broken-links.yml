name: 🔗 ऑटोमैटिक ब्रोकन लिंक रिपेयर

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🧠 स्कैन और रिपेयर
        run: |
          python3 -c "
import os, re, glob

print('🚀 स्कैनिंग शुरू...')
fixed = 0
for filepath in glob.glob('**/*.html', recursive=True):
    if '/.git/' in filepath:
        continue
    with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
        content = f.read()
    old = content
    # फिक्स 1: notes/other/ -> notes/other-trades/
    content = content.replace('notes/other/index.html', 'notes/other-trades/index.html')
    content = content.replace('notes/other/', 'notes/other-trades/')
    # फिक्स 2: ../ की डेप्थ एरर (रूट फाइल्स के लिए)
    content = content.replace('href=\"../index.html\"', 'href=\"/index.html\"')
    content = content.replace('href=\"../iti-result.html\"', 'href=\"/iti-result.html\"')
    content = content.replace('href=\"../engineering-notes.html\"', 'href=\"/engineering-notes.html\"')
    # फिक्स 3: हर जगह प्लेसहोल्डर डालें
    if '<div id=\"header-placeholder\"' not in content:
        content = content.replace('<body>', '<body>\n    <div id=\"header-placeholder\"></div>')
    if '<div id=\"footer-placeholder\"' not in content:
        content = content.replace('</body>', '    <div id=\"footer-placeholder\"></div>\n</body>')
    if '/js/main.js' not in content:
        content = content.replace('</body>', '    <script src=\"/js/main.js\"></script>\n</body>')
    if content != old:
        with open(filepath, 'w', encoding='utf-8') as f:
            f.write(content)
        print(f'✅ {filepath}')
        fixed += 1
print(f'🎉 {fixed} फाइलें ठीक हुईं!')
"
      - name: 📤 पुश
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "🤖 ऑटो लिंक रिपेयर"
          git push
