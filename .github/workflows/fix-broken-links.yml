name: 🔗 100% ऑटोमैटिक लिंक रिपेयर (डेप्थ फिक्स)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deep-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🧠 पूरी वेबसाइट स्कैन करें और डेप्थ एडजस्ट करें
        run: |
          python -c "
import os, re, glob

print('🚀 डीप स्कैन शुरू...')
fixed_count = 0
missing_files = []

def get_depth(filepath):
    # फोल्डर की गहराई निकालें
    parts = filepath.replace('\\', '/').split('/')
    depth = 0
    for part in parts[:-1]:  # filename छोड़कर
        if part and part not in ['.', '..']:
            depth += 1
    return depth

def fix_links_in_file(filepath):
    global fixed_count
    with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
        content = f.read()
    original = content

    # फाइल की डेप्थ
    current_depth = get_depth(filepath)

    # सारे href ढूंढें
    pattern = r'href=[\"\']([^\"\']+)[\"\']'
    matches = re.findall(pattern, content)

    for href in matches:
        # बाहरी लिंक या एंकर को इग्नोर करें
        if href.startswith(('http', 'https', '#', 'mailto:', 'tel:')):
            continue
        
        # खाली या सिर्फ '/' वाला लिंक
        if href in ['', '/']:
            continue

        # अगर लिंक .html या फोल्डर पर है
        if href.endswith('.html') or href.endswith('/'):
            # लक्ष्य फाइल का पूरा पथ निकालें
            target_path = os.path.normpath(os.path.join(os.path.dirname(filepath), href))
            if not os.path.exists(target_path):
                # अगर फाइल नहीं मिली, तो रूट में ढूंढें
                root_target = os.path.basename(target_path)
                if root_target and os.path.exists(root_target):
                    # रूट में मिल गई, तो सही पाथ बनाएँ
                    target_depth = 0
                    relative_path = '../' * current_depth + root_target
                    content = content.replace(f'href=\"{href}\"', f'href=\"{relative_path}\"')
                    print(f'  🔧 फिक्स: {href} -> {relative_path}')
                    fixed_count += 1
                    # डुप्लीकेट रिप्लेस से बचने के लिए ब्रेक (एक बार में एक)
                    # लेकिन हर लिंक अलग है, इसलिए हम चेक करते रहेंगे
            # else:
                # फाइल मिल गई है, कुछ नहीं करना
                # pass

        # विशेष फिक्स: notes/other/ को notes/other-trades/ में बदलें
        if 'notes/other/index.html' in href or 'notes/other/' in href:
            new_href = href.replace('notes/other/index.html', 'notes/other-trades/index.html').replace('notes/other/', 'notes/other-trades/')
            content = content.replace(href, new_href)
            print(f'  🔧 फिक्स: {href} -> {new_href}')
            fixed_count += 1

    # अगर बदलाव हुआ है तो सेव करें
    if content != original:
        with open(filepath, 'w', encoding='utf-8') as f:
            f.write(content)
        print(f'✅ फिक्स किया: {filepath}')
        return True
    return False

# सभी HTML फाइलों पर लूप करें
html_files = glob.glob('**/*.html', recursive=True)
for file in html_files:
    if '/.git/' in file:
        continue
    if fix_links_in_file(file):
        fixed_count += 1

print(f'\n🎉 कुल {fixed_count} लिंक्स ठीक कर दिए गए!')
print('📄 अब अपनी वेबसाइट Hard Refresh (Ctrl+Shift+R) करके देखें।')
"
      - name: 📤 GitHub पर पुश करें
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "🤖 डीप लिंक रिपेयर - सारी डेप्थ एरर ठीक कर दी गईं"
          git push
