name: 🔧 ऑटोमैटिक ब्रोकन लिंक & पाथ फिक्सर

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fix-broken-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🧹 सारे HTML स्कैन करें और लिंक/पाथ ठीक करें
        run: |
          python -c "
import os, re, glob

print('🚀 पूरी वेबसाइट स्कैन की जा रही है...')
fixed_count = 0

for filepath in glob.glob('**/*.html', recursive=True):
    if '/.git/' in filepath or 'node_modules' in filepath:
        continue
    
    with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
        content = f.read()
    
    original = content
    
    # ---- 1. ब्रोकन लिंक फिक्स (जो आपने बताए) ----
    # Other Trades का पाथ सही करें (अगर गलत है तो)
    content = content.replace('notes/other/index.html', 'notes/other-trades/index.html')
    content = content.replace('notes/other/', 'notes/other-trades/')
    
    # Employability Skills के पाथ में कोई गड़बड़ी हो तो ठीक करें
    content = content.replace('notes/employability-skills/index.html', 'notes/employability-skills/index.html')  # पहले से सही है, पर स्कैन कर लें
    
    # Engineering Links में 'Engineering Notes' को सही करें
    content = content.replace('engineering-notes.html', 'engineering-notes.html')  # सुरक्षित रखें
    
    # ---- 2. सारे पुराने हेडर/फूटर हटाएँ (डुप्लीकेट रोकने के लिए) ----
    content = re.sub(r'<div id="header"[^>]*>.*?</div>', '', content, flags=re.DOTALL | re.IGNORECASE)
    content = re.sub(r'<div id="footer"[^>]*>.*?</div>', '', content, flags=re.DOTALL | re.IGNORECASE)
    content = re.sub(r'<header[^>]*>.*?</header>', '', content, flags=re.DOTALL | re.IGNORECASE)
    content = re.sub(r'<footer[^>]*>.*?</footer>', '', content, flags=re.DOTALL | re.IGNORECASE)
    
    # ---- 3. हार्डकोडेड Header/Footer (जो हमने डाले हैं) को सुरक्षित रखने के लिए, हम डुप्लीकेट कंटेनर हटाएँगे ----
    # अगर पेज में .main-header (हार्डकोडेड) है, तो #header-placeholder को हटा दें (ताकि Double न आए)
    if '<div class="main-header"' in content:
        content = re.sub(r'<div id="header-placeholder"[^>]*>.*?</div>', '', content, flags=re.DOTALL | re.IGNORECASE)
        content = re.sub(r'<div id="footer-placeholder"[^>]*>.*?</div>', '', content, flags=re.DOTALL | re.IGNORECASE)
        # अगर hardcoded है तो JS को रोकने के लिए कोई जरूरत नहीं, बस प्लेसहोल्डर हटाओ
    else:
        # अगर hardcoded नहीं है, तो प्लेसहोल्डर डालें (ताकि JS लोड कर सके)
        if '<div id="header-placeholder"' not in content:
            content = content.replace('<body>', '<body>\n    <div id="header-placeholder"></div>')
        if '<div id="footer-placeholder"' not in content:
            content = content.replace('</body>', '    <div id="footer-placeholder"></div>\n</body>')

    # ---- 4. main.js लिंक करें (अगर नहीं है) ----
    if '/js/main.js' not in content:
        content = content.replace('</body>', '    <script src=\"/js/main.js\"></script>\n</body>')
    
    if content != original:
        with open(filepath, 'w', encoding='utf-8') as f:
            f.write(content)
        print(f'✅ ठीक किया: {filepath}')
        fixed_count += 1
    else:
        print(f'⏩ पहले से सही: {filepath}')

print(f'\n🎉 कुल {fixed_count} फाइलें ठीक कर दी गईं!')
"
      - name: 📤 GitHub पर पुश करें
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "🤖 Action: सारे टूटे लिंक और पाथ ठीक कर दिए"
          git push
