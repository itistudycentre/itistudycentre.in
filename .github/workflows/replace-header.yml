name: 🔄 Auto Fix Headers

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  fix-headers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: pip install beautifulsoup4

      - name: 🚀 Run Header Fixer
        run: python replace_headers.py

      - name: 📤 Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "fix: unified header applied [skip ci]"
          git push
