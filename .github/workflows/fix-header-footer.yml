name: 🔧 ऑटोमैटिक हेडर/फूटर फिक्स (सारी फाइलें एक साथ)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fix-all-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🧹 सारे HTML पेज स्कैन करो और फिक्स करो
        run: |
          python -c "
import os, re, glob
print('🚀 स्कैनिंग शुरू...')
fixed_count = 0
for filepath in glob.glob('**/*.html', recursive=True):
    if '/.git/' in filepath or 'node_modules' in filepath:
        continue
    with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
        content = f.read()
    original = content
    # 1. पुराने हार्डकोडेड हेडर हटाएँ (सभी किस्म के)
    content = re.sub(r'<div id="header"[^>]*>.*?</div>', '', content, flags=re.DOTALL | re.IGNORECASE)
    content = re.sub(r'<header[^>]*>.*?</header>', '', content, flags=re.DOTALL | re.IGNORECASE)
    content = re.sub(r'<div class="main-header"[^>]*>.*?</div>', '', content, flags=re.DOTALL | re.IGNORECASE)
    # 2. पुराने हार्डकोडेड फूटर हटाएँ
    content = re.sub(r'<div id="footer"[^>]*>.*?</div>', '', content, flags=re.DOTALL | re.IGNORECASE)
    content = re.sub(r'<footer[^>]*>.*?</footer>', '', content, flags=re.DOTALL | re.IGNORECASE)
    # 3. नए प्लेसहोल्डर डालें
    if '<div id="header-placeholder"' not in content:
        content = content.replace('<body>', '<body>\n    <div id=\"header-placeholder\"></div>')
    if '<div id="footer-placeholder"' not in content:
        content = content.replace('</body>', '    <div id=\"footer-placeholder\"></div>\n</body>')
    # 4. main.js लिंक करें
    if '/js/main.js' not in content:
        content = content.replace('</body>', '    <script src=\"/js/main.js\"></script>\n</body>')
    if content != original:
        with open(filepath, 'w', encoding='utf-8') as f:
            f.write(content)
        print(f'✅ ठीक किया: {filepath}')
        fixed_count += 1
print(f'\n🎉 कुल {fixed_count} फाइलें ठीक हो गईं!')
"
      - name: 📤 GitHub पर पुश करें
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "🤖 Action: सारे पेजों में यूनिफॉर्म हेडर/फूटर डाल दिया"
          git push
