name: 💬 Fix Central Comment System

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-comments:
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 💬 Run comment system fixer
        run: node fix-comments.js

      - name: 🔍 Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 💾 Commit changed HTML files
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "*.html"
          git add "**/*.html"

          git commit -m "💬 Centralize website suggestions"

          git push

      - name: ✅ No changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No HTML changes were required."
