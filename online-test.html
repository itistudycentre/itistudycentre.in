<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Test – ITI Study Centre</title>
  <style>
    /* ... (आपका existing CSS यहाँ) ... */
  </style>
</head>
<body>
  <!-- ... (आपका existing HTML) ... -->

  <script>
    function loadQuestionBank() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        // Try local file first, then /js/
        script.src = 'question-bank.js?v=' + Date.now();
        script.onload = function() {
          if (typeof window.QUESTION_BANK !== 'undefined') {
            console.log('✅ QUESTION_BANK loaded:', Object.keys(window.QUESTION_BANK));
            resolve();
          } else {
            // Fallback: try /js/ path
            const script2 = document.createElement('script');
            script2.src = '/js/question-bank.js?v=' + Date.now();
            script2.onload = function() {
              if (typeof window.QUESTION_BANK !== 'undefined') {
                console.log('✅ QUESTION_BANK loaded from /js/');
                resolve();
              } else {
                reject('QUESTION_BANK not found in loaded script');
              }
            };
            script2.onerror = function() { reject('Failed to load /js/question-bank.js'); };
            document.head.appendChild(script2);
          }
        };
        script.onerror = function() {
          // Fallback to /js/
          const script2 = document.createElement('script');
          script2.src = '/js/question-bank.js?v=' + Date.now();
          script2.onload = function() {
            if (typeof window.QUESTION_BANK !== 'undefined') {
              console.log('✅ QUESTION_BANK loaded from /js/ (fallback)');
              resolve();
            } else {
              reject('QUESTION_BANK not found in fallback script');
            }
          };
          script2.onerror = function() { reject('Failed to load /js/question-bank.js (fallback)'); };
          document.head.appendChild(script2);
        };
        document.head.appendChild(script);
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadQuestionBank()
        .then(() => {
          document.getElementById('loaderScreen').style.display = 'none';
          document.getElementById('screenMain').classList.add('active');
          renderMainMenu();
          console.log('✅ Online Test ready!');
        })
        .catch((err) => {
          document.getElementById('loaderScreen').innerHTML = `
            <p style="color:#dc3545; font-size:1.2rem;">❌ Failed to load question bank</p>
            <p style="color:#888; font-size:0.9rem;">Make sure <strong>question-bank.js</strong> is in the same folder as this page, or in <strong>/js/</strong> folder.</p>
            <p style="color:#888; font-size:0.85rem;">Error: ${err}</p>
            <button onclick="location.reload()" style="margin-top:16px; padding:10px 24px; background:#003366; color:#fff; border:none; border-radius:6px; cursor:pointer;">🔄 Retry</button>
          `;
          console.error('❌ Error loading question bank:', err);
        });
    });

    // ... (बाकी functions: renderMainMenu, selectTestType, loadYears, etc.)
  </script>
</body>
</html>
