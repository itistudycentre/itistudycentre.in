<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employability Skills – Question Bank</title>
    <style>
        /* ... (आपका पुराना CSS यहाँ) ... */
        /* मैंने इसे छोटा कर दिया है, आप अपना मौजूदा CSS रख सकते हैं */
        body { font-family: Arial, sans-serif; background: #f4f7fc; padding:20px; }
        .container { max-width:1100px; margin:auto; background:#fff; padding:20px; border-radius:10px; }
        .module-box { border:1px solid #ddd; margin-bottom:20px; border-radius:8px; }
        .module-title { background:#003366; color:#fff; padding:12px 20px; cursor:pointer; }
        .module-body { padding:15px; display:block; }
        .q-item { border-bottom:1px solid #eee; padding:12px 0; }
        .opt-correct { background:#d4edda; padding:2px 8px; border-radius:4px; }
        .lang-btn { background:#003366; color:#fff; border:none; padding:8px 20px; border-radius:6px; cursor:pointer; float:right; }
    </style>
</head>
<body>
<div class="container">
    <h1>📘 Employability Skills – Question Bank</h1>
    <button class="lang-btn" onclick="toggleLang()">🇮🇳 हिंदी / 🇬🇧 English</button>
    <div id="content"><p>Loading...</p></div>
</div>
<script>
let data = null, lang = 'en';

function loadData() {
    const script = document.createElement('script');
    script.src = '/js/question-bank.js?v=' + Date.now();
    script.onload = function() {
        if (window.QUESTION_BANK?.employability) {
            data = window.QUESTION_BANK.employability;
            render();
        } else {
            document.getElementById('content').innerHTML = '<p style="color:red;">❌ Data not found.</p>';
        }
    };
    script.onerror = function() { document.getElementById('content').innerHTML = '<p style="color:red;">❌ Failed to load /js/question-bank.js</p>'; };
    document.head.appendChild(script);
}

function render() {
    let html = '';
    for (let year in data) {
        html += `<h2>📅 ${year}</h2>`;
        const modules = data[year]?.modules || data[year];
        for (let mod in modules) {
            const qs = modules[mod]?.questions || modules[mod];
            if (!Array.isArray(qs)) continue;
            html += `<div class="module-box">
                <div class="module-title" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">📘 ${mod} (${qs.length} Qs)</div>
                <div class="module-body">`;
            qs.forEach((q, i) => {
                const qText = lang === 'en' ? q.qE : q.qH;
                const opts = lang === 'en' ? q.oE : q.oH;
                const correct = q.correct !== undefined ? q.correct : q.c;
                html += `<div class="q-item">
                    <b>Q${i+1}:</b> ${qText}<br>
                    ${opts.map((o, oi) => `<span class="${oi === correct ? 'opt-correct' : ''}">${String.fromCharCode(65+oi)}. ${o}</span> `).join('')}
                    <span style="color:green;font-size:0.8rem;"> ✅ ${opts[correct]}</span>
                </div>`;
            });
            html += `</div></div>`;
        }
    }
    document.getElementById('content').innerHTML = html;
}

function toggleLang() {
    lang = (lang === 'en') ? 'hi' : 'en';
    render();
    document.querySelector('.lang-btn').textContent = lang === 'en' ? '🇮🇳 हिंदी / 🇬🇧 English' : '🇬🇧 English / 🇮🇳 हिंदी';
}

loadData();
</script>
</body>
</html>
