<!DOCTYPE html>

<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin — Comments Moderation | ITI Study Centre</title>
<meta content="noindex, nofollow" name="robots"/>
<link href="/images/favicon.png" rel="icon"/>
<link href="/css/style.css" rel="stylesheet"/>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',Roboto,Arial,sans-serif;
  background:#f5f7fb;
  color:#1e2a3a;
}

.admin-topbar{
  background:#003366;
  padding:16px 20px;
  border-bottom:4px solid #ffcc00;
  color:#fff;
}

.admin-topbar .bar{
  max-width:900px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.admin-topbar h1{
  font-size:1.15rem;
}

.container{
  max-width:900px;
  margin:0 auto;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:22px;
  border:1px solid #e6eaef;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.field{
  width:100%;
  padding:13px 16px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:1rem;
  margin-bottom:12px;
  font-family:inherit;
}

.field:focus{
  outline:none;
  border-color:#003366;
}

.btn{
  background:#003366;
  color:#fff;
  border:none;
  padding:12px 22px;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
  border-bottom:3px solid #ffcc00;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.login-btn{
  width:100%;
  margin-top:4px;
  font-size:1rem;
}

.err{
  color:#a33;
  font-size:.9rem;
  margin-top:12px;
  display:none;
  padding:10px 12px;
  background:#fdecea;
  border-radius:8px;
}

.err.show{
  display:block;
}

.success{
  color:#256029;
  background:#eaf7ea;
}

.hidden{
  display:none !important;
}

.login-info{
  color:#666;
  font-size:.88rem;
  margin-bottom:16px;
  line-height:1.5;
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.filters button{
  background:#e9ecef;
  border:none;
  padding:8px 16px;
  border-radius:20px;
  cursor:pointer;
  font-size:.9rem;
}

.filters button.active{
  background:#003366;
  color:#fff;
}

.stats{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:16px;
  font-size:.9rem;
  color:#555;
}

.stats b{
  color:#003366;
}

.item{
  border:1px solid #e6eaef;
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:12px;
  background:#f9fafc;
}

.item .top{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:6px;
  align-items:center;
}

.item .page{
  font-size:.78rem;
  color:#666;
  background:#eef2f7;
  padding:2px 8px;
  border-radius:6px;
  display:inline-block;
  margin-top:4px;
}

.item .status{
  font-size:.75rem;
  padding:2px 10px;
  border-radius:12px;
  font-weight:600;
}

.status.pending{
  background:#fff3cd;
  color:#856404;
}

.status.approved{
  background:#d4edda;
  color:#256029;
}

.status.rejected{
  background:#f8d7da;
  color:#842029;
}

.item p{
  margin:6px 0;
  white-space:pre-wrap;
  word-break:break-word;
}

.item .meta{
  font-size:.78rem;
  color:#888;
}

.item .actions{
  display:flex;
  gap:8px;
  margin-top:8px;
  flex-wrap:wrap;
}

.item .actions button{
  border:none;
  padding:8px 14px;
  border-radius:8px;
  font-size:.85rem;
  cursor:pointer;
  color:#fff;
}

.btn-approve{
  background:#28a745;
}

.btn-reject{
  background:#dc3545;
}

.btn-delete{
  background:#6c757d;
}

#logoutBtn{
  background:transparent;
  border:1px solid #fff;
  color:#fff;
  padding:6px 14px;
  border-radius:6px;
  cursor:pointer;
  white-space:nowrap;
}

.user-info{
  font-size:.85rem;
  color:#666;
  margin-bottom:14px;
  word-break:break-word;
}

@media(max-width:600px){

  .container{
    padding:15px;
  }

  .card{
    padding:18px;
  }

  .admin-topbar{
    padding:14px 15px;
  }

  .admin-topbar .bar{
    align-items:flex-start;
  }

  .admin-topbar h1{
    font-size:1rem;
  }

}
</style>
</head>
<body>
<div id="header-container"></div>
<script defer="" src="/js/header-loader.js"></script>



<!-- ADMIN TOP BAR -->
<div class="admin-topbar">
<div class="bar">
<h1>
      🔐 Comments Admin — ITI Study Centre
    </h1>
<button class="hidden" id="logoutBtn" type="button">
      Logout
    </button>
</div>
</div>
<div class="container">
<!-- =====================================================
     LOGIN
====================================================== -->
<div class="card" id="loginCard">
<h2 style="margin-bottom:10px;">
    Admin Login
  </h2>
<p class="login-info">
    अपने Admin Email और Password से login करें।
  </p>
<form id="loginForm">
<input autocomplete="email" class="field" id="emailInput" placeholder="Admin Email" required="" type="email"/>
<input autocomplete="current-password" class="field" id="passwordInput" placeholder="Password" required="" type="password"/>
<button class="btn login-btn" id="loginBtn" type="submit">
      Login
    </button>
</form>
<div class="err" id="loginError"></div>
</div>
<!-- =====================================================
     NOT AUTHORIZED
====================================================== -->
<div class="card hidden" id="notAuthorizedCard">
<h3 style="margin-bottom:10px;">
    ❌ Access Denied
  </h3>
<p>
    यह Firebase account Admin के रूप में authorized नहीं है।
  </p>
<p style="margin-top:10px;color:#666;font-size:.9rem;">
    Admin access के लिए Firebase Firestore में
    <code>admins/{User UID}</code> document होना चाहिए।
  </p>
</div>
<!-- =====================================================
     ADMIN CONTENT
====================================================== -->
<div class="hidden" id="adminContent">
<div class="card">
<div class="user-info" id="adminUserInfo"></div>
<div class="stats" id="stats"></div>
<div class="filters" id="filters">
<button class="active" data-filter="all" type="button">
        All
      </button>
<button data-filter="pending" type="button">
        Pending
      </button>
<button data-filter="approved" type="button">
        Approved
      </button>
<button data-filter="rejected" type="button">
        Rejected
      </button>
</div>
<div id="commentList"></div>
</div>
</div>
</div>
<!-- FOOTER -->
<footer style="
    background:#222;
    color:#ccc;
    padding:20px 15px;
    text-align:center;
    margin-top:40px;
    border-top:4px solid #003366;
  ">
<p>
    © <span id="admYear"></span>
    ITI Study Centre. सर्वाधिकार सुरक्षित।
  </p>
</footer>
<script>
document.getElementById("admYear").textContent =
  new Date().getFullYear();
</script>
<!-- =====================================================
     FIREBASE
====================================================== -->
<script type="module">

import {
  initializeApp,
  getApps,
  getApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
  initializeAppCheck,
  ReCaptchaV3Provider
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app-check.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  doc,
  getDoc,
  onSnapshot,
  updateDoc,
  deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
====================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyAyBiDGQxQ5LEtIV5JtMOT79rU3ksQg8TE",

  authDomain:
    "iti-study-centre.firebaseapp.com",

  projectId:
    "iti-study-centre",

  storageBucket:
    "iti-study-centre.firebasestorage.app",

  messagingSenderId:
    "690794814318",

  appId:
    "1:690794814318:web:42ed1c1f582a9e1df5bf7f"

};


/* =====================================================
   APP CHECK
====================================================== */

const RECAPTCHA_SITE_KEY =
  "6LexjYctAAAAAJdA17IjqdkfJrecHtmqnd-DoODv";


/* =====================================================
   INITIALIZE APP
====================================================== */

const app =
  getApps().length
    ? getApp()
    : initializeApp(firebaseConfig);


/* =====================================================
   INITIALIZE APP CHECK
====================================================== */

if (!window.__itiAppCheckInitialized) {

  try {

    initializeAppCheck(
      app,
      {
        provider:
          new ReCaptchaV3Provider(
            RECAPTCHA_SITE_KEY
          ),

        isTokenAutoRefreshEnabled:
          true
      }
    );

  } catch(error) {

    console.warn(
      "App Check initialization:",
      error
    );

  }

  window.__itiAppCheckInitialized =
    true;
}


/* =====================================================
   AUTH + FIRESTORE
====================================================== */

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =====================================================
   ELEMENTS
====================================================== */

const loginCard =
  document.getElementById(
    "loginCard"
  );

const notAuthorizedCard =
  document.getElementById(
    "notAuthorizedCard"
  );

const adminContent =
  document.getElementById(
    "adminContent"
  );

const logoutBtn =
  document.getElementById(
    "logoutBtn"
  );

const loginForm =
  document.getElementById(
    "loginForm"
  );

const emailInput =
  document.getElementById(
    "emailInput"
  );

const passwordInput =
  document.getElementById(
    "passwordInput"
  );

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const loginError =
  document.getElementById(
    "loginError"
  );

const adminUserInfo =
  document.getElementById(
    "adminUserInfo"
  );


/* =====================================================
   ERROR MESSAGE
====================================================== */

function showError(message){

  loginError.textContent =
    message;

  loginError.classList.add(
    "show"
  );

  loginError.classList.remove(
    "success"
  );

}


function showSuccess(message){

  loginError.textContent =
    message;

  loginError.classList.add(
    "show",
    "success"
  );

}


function clearError(){

  loginError.textContent =
    "";

  loginError.classList.remove(
    "show",
    "success"
  );

}


/* =====================================================
   LOGIN
====================================================== */

loginForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    clearError();

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if(!email){

      showError(
        "कृपया Admin Email दर्ज करें।"
      );

      return;
    }


    if(!password){

      showError(
        "कृपया Password दर्ज करें।"
      );

      return;
    }


    loginBtn.disabled =
      true;

    loginBtn.textContent =
      "Login हो रहा है...";


    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      /*
        Login successful होने के बाद
        onAuthStateChanged() automatically
        Admin UID check करेगा.
      */

    }

    catch(error){

      console.error(
        "LOGIN ERROR:",
        error
      );


      let message =
        "Login नहीं हो सका।";


      if(
        error.code ===
        "auth/invalid-credential"
      ){

        message =
          "Email या Password गलत है।";

      }

      else if(
        error.code ===
        "auth/invalid-email"
      ){

        message =
          "Email address सही नहीं है।";

      }

      else if(
        error.code ===
        "auth/user-disabled"
      ){

        message =
          "यह Admin account disabled है।";

      }

      else if(
        error.code ===
        "auth/too-many-requests"
      ){

        message =
          "बहुत अधिक login attempts हुए हैं। कुछ समय बाद पुनः प्रयास करें।";

      }

      else{

        message +=
          " (" +
          (
            error.code ||
            error.message ||
            "unknown-error"
          ) +
          ")";

      }


      showError(message);

    }

    finally{

      loginBtn.disabled =
        false;

      loginBtn.textContent =
        "Login";

    }

  }
);


/* =====================================================
   LOGOUT
====================================================== */

logoutBtn.addEventListener(
  "click",
  async function(){

    try{

      await signOut(auth);

    }

    catch(error){

      console.error(
        "Logout error:",
        error
      );

    }

  }
);


/* =====================================================
   AUTH STATE
====================================================== */

onAuthStateChanged(
  auth,
  async function(user){

    /*
      User logged out
    */

    if(!user){

      loginCard.classList.remove(
        "hidden"
      );

      notAuthorizedCard.classList.add(
        "hidden"
      );

      adminContent.classList.add(
        "hidden"
      );

      logoutBtn.classList.add(
        "hidden"
      );

      adminUserInfo.textContent =
        "";

      return;

    }


    /*
      User logged in
      Now check:

      admins/{user.uid}
    */

    try{

      const adminRef =
        doc(
          db,
          "admins",
          user.uid
        );


      const adminDoc =
        await getDoc(
          adminRef
        );


      /*
        Show logout
      */

      logoutBtn.classList.remove(
        "hidden"
      );


      /*
        User is NOT admin
      */

      if(
        !adminDoc.exists()
      ){

        loginCard.classList.add(
          "hidden"
        );

        adminContent.classList.add(
          "hidden"
        );

        notAuthorizedCard.classList.remove(
          "hidden"
        );

        /*
          Immediately sign out unauthorized
          account so it cannot remain logged in.
        */

        await signOut(auth);

        return;

      }


      /*
        User IS admin
      */

      loginCard.classList.add(
        "hidden"
      );

      notAuthorizedCard.classList.add(
        "hidden"
      );

      adminContent.classList.remove(
        "hidden"
      );


      adminUserInfo.textContent =
        "Logged in as: " +
        (
          user.email ||
          "Admin"
        );


      /*
        Start comments listener
      */

      startCommentsListener();

    }

    catch(error){

      console.error(
        "ADMIN AUTHORIZATION ERROR:",
        error
      );


      loginCard.classList.add(
        "hidden"
      );

      adminContent.classList.add(
        "hidden"
      );

      notAuthorizedCard.classList.remove(
        "hidden"
      );


      showError(
        "Admin authorization check में समस्या हुई: " +
        (
          error.code ||
          error.message ||
          ""
        )
      );

    }

  }
);


/* =====================================================
   COMMENTS
====================================================== */

let allComments = [];

let currentFilter =
  "all";

let unsubscribe =
  null;


/* =====================================================
   START COMMENTS LISTENER
====================================================== */

function startCommentsListener(){

  if(unsubscribe){

    return;

  }


  unsubscribe =
    onSnapshot(

      collection(
        db,
        "comments"
      ),

      function(snapshot){

        allComments = [];


        snapshot.forEach(
          function(documentSnapshot){

            allComments.push({

              id:
                documentSnapshot.id,

              ...documentSnapshot.data()

            });

          }
        );


        /*
          Newest comments first
        */

        allComments.sort(
          function(a,b){

            const timeA =
              a.createdAt &&
              a.createdAt.toDate
                ? a.createdAt
                    .toDate()
                    .getTime()
                : 0;


            const timeB =
              b.createdAt &&
              b.createdAt.toDate
                ? b.createdAt
                    .toDate()
                    .getTime()
                : 0;


            return timeB -
                   timeA;

          }
        );


        renderStats();

        renderList();

      },

      function(error){

        console.error(
          "Comments listener error:",
          error
        );

        document.getElementById(
          "commentList"
        ).innerHTML =

          `<p style="color:#a33;">
            Comments लोड नहीं हो सके।
            कृपया Firestore Rules जाँचें।
          </p>`;

      }

    );

}


/* =====================================================
   STATS
====================================================== */

function renderStats(){

  const total =
    allComments.length;


  const pending =
    allComments.filter(
      function(comment){

        return comment.status ===
               "pending";

      }
    ).length;


  const approved =
    allComments.filter(
      function(comment){

        return comment.status ===
               "approved";

      }
    ).length;


  const rejected =
    allComments.filter(
      function(comment){

        return comment.status ===
               "rejected";

      }
    ).length;


  document.getElementById(
    "stats"
  ).innerHTML =

    `<span>
      कुल: <b>${total}</b>
    </span>

    <span>
      Pending: <b>${pending}</b>
    </span>

    <span>
      Approved: <b>${approved}</b>
    </span>

    <span>
      Rejected: <b>${rejected}</b>
    </span>`;

}


/* =====================================================
   ESCAPE HTML
====================================================== */

function escapeHtml(value){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value == null
      ? ""
      : String(value);

  return div.innerHTML;

}


/* =====================================================
   RENDER COMMENTS
====================================================== */

function renderList(){

  const list =
    currentFilter === "all"

      ? allComments

      : allComments.filter(
          function(comment){

            return comment.status ===
                   currentFilter;

          }
        );


  const container =
    document.getElementById(
      "commentList"
    );


  if(
    list.length === 0
  ){

    container.innerHTML =

      `<p style="
        color:#888;
        font-style:italic;
      ">
        कोई comment नहीं मिला।
      </p>`;

    return;

  }


  container.innerHTML =

    list.map(
      function(comment){

        const dateText =

          comment.createdAt &&
          comment.createdAt.toDate

            ? comment.createdAt
                .toDate()
                .toLocaleString(
                  "hi-IN"
                )

            : "अभी";


        const status =
          comment.status ||
          "pending";


        return `

          <div
            class="item"
            data-id="${escapeHtml(
              comment.id
            )}"
          >

            <div class="top">

              <span>

                <strong>
                  ${escapeHtml(
                    comment.name ||
                    "Anonymous"
                  )}
                </strong>

                <span class="meta">
                  ${escapeHtml(
                    dateText
                  )}
                </span>

              </span>


              <span
                class="status ${escapeHtml(
                  status
                )}"
              >
                ${escapeHtml(
                  status
                )}
              </span>

            </div>


            <span class="page">

              ${escapeHtml(
                comment.page ||
                ""
              )}

            </span>


            <p>
              ${escapeHtml(
                comment.message ||
                ""
              )}
            </p>


            <div class="actions">

              ${
                status !==
                "approved"

                  ? `

                    <button
                      class="btn-approve"
                      data-action="approve"
                      type="button"
                    >
                      ✅ Approve
                    </button>

                  `

                  : ""
              }


              ${
                status !==
                "rejected"

                  ? `

                    <button
                      class="btn-reject"
                      data-action="reject"
                      type="button"
                    >
                      ⛔ Reject
                    </button>

                  `

                  : ""
              }


              <button
                class="btn-delete"
                data-action="delete"
                type="button"
              >
                🗑️ Delete
              </button>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =====================================================
   FILTERS
====================================================== */

document
  .getElementById("filters")
  .addEventListener(
    "click",
    function(event){

      const button =
        event.target.closest(
          "button[data-filter]"
        );


      if(!button){

        return;

      }


      currentFilter =
        button.dataset.filter;


      document
        .querySelectorAll(
          "#filters button"
        )
        .forEach(
          function(btn){

            btn.classList.remove(
              "active"
            );

          }
        );


      button.classList.add(
        "active"
      );


      renderList();

    }
  );


/* =====================================================
   COMMENT ACTIONS
====================================================== */

document
  .getElementById("commentList")
  .addEventListener(
    "click",
    async function(event){

      const button =
        event.target.closest(
          "button[data-action]"
        );


      if(!button){

        return;

      }


      const item =
        button.closest(
          ".item"
        );


      if(!item){

        return;

      }


      const id =
        item.dataset.id;


      const action =
        button.dataset.action;


      try{

        /*
          APPROVE
        */

        if(
          action ===
          "approve"
        ){

          await updateDoc(

            doc(
              db,
              "comments",
              id
            ),

            {
              status:
                "approved"
            }

          );

        }


        /*
          REJECT
        */

        else if(
          action ===
          "reject"
        ){

          await updateDoc(

            doc(
              db,
              "comments",
              id
            ),

            {
              status:
                "rejected"
            }

          );

        }


        /*
          DELETE
        */

        else if(
          action ===
          "delete"
        ){

          const confirmed =
            confirm(
              "क्या आप वाकई इस comment को हमेशा के लिए delete करना चाहते हैं?"
            );


          if(!confirmed){

            return;

          }


          await deleteDoc(

            doc(
              db,
              "comments",
              id
            )

          );

        }

      }

      catch(error){

        console.error(
          "Comment action error:",
          error
        );


        alert(
          "Action विफल रहा। Firestore Rules या Admin permission जाँचें।"
        );

      }

    }
  );
