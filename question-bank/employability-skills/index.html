<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employability Skills – Question Bank</title>
    <style>
        /* ----- Reset & Base ----- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f4f7fc;
            padding: 20px;
            color: #1e2a3a;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 25px 30px 40px;
        }
        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 3px solid #1e7e34;
            padding-bottom: 16px;
            margin-bottom: 28px;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #3d5a73;
            margin-left: auto;
        }

        /* ----- Filters ----- */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 30px;
            background: #f0f5fa;
            padding: 18px 22px;
            border-radius: 14px;
            margin-bottom: 30px;
            align-items: flex-end;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1 1 200px;
        }
        .filter-group label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #1f3a4b;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .filter-group select {
            padding: 10px 14px;
            border: 2px solid #cbd8e6;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .filter-group select:focus {
            border-color: #1e7e34;
            outline: none;
            box-shadow: 0 0 0 3px rgba(30, 126, 52, 0.2);
        }
        .stats {
            font-size: 0.95rem;
            background: #e6edf5;
            padding: 6px 18px;
            border-radius: 40px;
            color: #1e3b4f;
            margin-left: auto;
            align-self: center;
            white-space: nowrap;
        }

        /* ----- Questions ----- */
        .question-card {
            background: #ffffff;
            border: 1px solid #e2eaf2;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            transition: box-shadow 0.15s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .question-card:hover {
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        }
        .q-number {
            font-weight: 600;
            color: #1e7e34;
            font-size: 0.9rem;
            background: #e6f2ea;
            display: inline-block;
            padding: 2px 14px;
            border-radius: 30px;
            margin-bottom: 10px;
        }
        .q-text {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 14px;
        }
        .q-text .en {
            font-weight: 500;
            color: #0b2b4a;
        }
        .q-text .hi {
            color: #2c3e50;
            background: #f8fafc;
            padding: 0 10px;
            border-radius: 8px;
        }
        .q-text .lang-tag {
            font-size: 0.7rem;
            font-weight: 600;
            color: #5a7a8a;
            margin-right: 4px;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 20px;
            background: #f9fcff;
            padding: 12px 16px;
            border-radius: 12px;
            margin: 6px 0 12px;
        }
        .option-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            padding: 4px 0;
            font-size: 0.98rem;
        }
        .option-item .opt-label {
            font-weight: 600;
            color: #3a5a6a;
            min-width: 20px;
        }
        .option-item .opt-en {
            color: #1a2a3a;
        }
        .option-item .opt-hi {
            color: #2c3e50;
            margin-left: 6px;
        }
        .option-item.correct {
            background: #d4edda;
            border-radius: 6px;
            padding-left: 8px;
            margin-left: -8px;
        }
        .option-item.correct .opt-label {
            color: #0b5e2a;
        }
        .correct-badge {
            display: inline-block;
            background: #1e7e34;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 30px;
            margin-left: 12px;
            letter-spacing: 0.3px;
        }
        .answer-hint {
            margin-top: 12px;
            font-size: 0.95rem;
            border-top: 1px dashed #dce5ef;
            padding-top: 12px;
            color: #1d3b4f;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
        }
        .answer-hint strong {
            color: #0b2b4a;
        }

        /* ----- Responsive ----- */
        @media (max-width: 700px) {
            .container {
                padding: 18px 16px;
            }
            h1 {
                font-size: 1.5rem;
                flex-wrap: wrap;
            }
            h1 small {
                margin-left: 0;
                width: 100%;
            }
            .filters {
                flex-direction: column;
                gap: 12px;
            }
            .filter-group {
                flex: 1 1 auto;
                width: 100%;
            }
            .options {
                grid-template-columns: 1fr;
                gap: 4px;
            }
            .question-card {
                padding: 16px;
            }
            .stats {
                margin-left: 0;
                align-self: flex-start;
            }
            .q-text {
                font-size: 0.98rem;
            }
        }

        @media (max-width: 480px) {
            .option-item {
                flex-wrap: wrap;
            }
            .correct-badge {
                margin-left: 0;
                margin-top: 4px;
            }
        }

        /* loader / empty */
        .empty-msg {
            text-align: center;
            padding: 40px 20px;
            color: #5a7a8a;
            font-size: 1.1rem;
        }
        .loader {
            text-align: center;
            padding: 30px;
            color: #3d6b7a;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            color: #6a8a9a;
            font-size: 0.85rem;
            border-top: 1px solid #e0e8f0;
            padding-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">

    <h1>
        📘 Employability Skills – Question Bank
        <small>ITI Study Centre</small>
    </h1>

    <!-- Filters -->
    <div class="filters">
        <div class="filter-group">
            <label for="yearSelect">Year / Module Group</label>
            <select id="yearSelect"></select>
        </div>
        <div class="filter-group">
            <label for="moduleSelect">Module</label>
            <select id="moduleSelect"></select>
        </div>
        <div class="stats" id="questionCount">प्रश्न: 0</div>
    </div>

    <!-- Questions container -->
    <div id="questionsContainer">
        <div class="loader">⏳ कृपया प्रतीक्षा करें…</div>
    </div>

    <footer>
        प्रश्न बैंक v1.0 · हिंदी और अंग्रेज़ी में · सही उत्तर हरे रंग में हाइलाइट किए गए हैं
    </footer>
</div>

<!-- Load question bank -->
<script src="question-bank.js"></script>

<!-- Main script -->
<script>
    (function() {
        // ----- Wait for data to be available -----
        function init() {
            const bank = window.QUESTION_BANK && window.QUESTION_BANK.employability;
            if (!bank) {
                document.getElementById('questionsContainer').innerHTML =
                    '<div class="empty-msg">❌ Question bank data not found. Make sure <strong>question-bank.js</strong> is loaded.</div>';
                return;
            }

            // ----- DOM refs -----
            const yearSelect = document.getElementById('yearSelect');
            const moduleSelect = document.getElementById('moduleSelect');
            const container = document.getElementById('questionsContainer');
            const countSpan = document.getElementById('questionCount');

            // Get sorted year keys (preserve order: 1st Year, 2nd Year, AI Module)
            const yearKeys = Object.keys(bank);
            // Optionally reorder if needed – we keep as is.

            // ----- Populate year dropdown -----
            yearKeys.forEach(year => {
                const opt = document.createElement('option');
                opt.value = year;
                opt.textContent = year;
                yearSelect.appendChild(opt);
            });

            // ----- Helper: load modules for a given year -----
            function loadModules(year) {
                const modules = bank[year]?.modules || {};
                const moduleNames = Object.keys(modules);
                moduleSelect.innerHTML = '';
                if (moduleNames.length === 0) {
                    const opt = document.createElement('option');
                    opt.textContent = '— No modules —';
                    opt.disabled = true;
                    moduleSelect.appendChild(opt);
                    container.innerHTML = '<div class="empty-msg">इस वर्ष में कोई मॉड्यूल नहीं हैं।</div>';
                    countSpan.textContent = 'प्रश्न: 0';
                    return;
                }
                moduleNames.forEach(mod => {
                    const opt = document.createElement('option');
                    opt.value = mod;
                    opt.textContent = mod;
                    moduleSelect.appendChild(opt);
                });
                // Auto-select first module and load questions
                if (moduleNames.length > 0) {
                    moduleSelect.value = moduleNames[0];
                    loadQuestions(year, moduleNames[0]);
                }
            }

            // ----- Helper: load questions for a specific module -----
            function loadQuestions(year, moduleName) {
                const moduleData = bank[year]?.modules?.[moduleName];
                if (!moduleData || !Array.isArray(moduleData.questions)) {
                    container.innerHTML = '<div class="empty-msg">❌ प्रश्न नहीं मिले।</div>';
                    countSpan.textContent = 'प्रश्न: 0';
                    return;
                }

                const questions = moduleData.questions;
                countSpan.textContent = `प्रश्न: ${questions.length}`;

                if (questions.length === 0) {
                    container.innerHTML = '<div class="empty-msg">इस मॉड्यूल में कोई प्रश्न नहीं हैं।</div>';
                    return;
                }

                let html = '';
                const optionLabels = ['A', 'B', 'C', 'D'];

                questions.forEach((q, idx) => {
                    const correctIndex = q.c; // 0-based
                    const enOpts = q.oE || [];
                    const hiOpts = q.oH || [];

                    html += `<div class="question-card">`;
                    html += `<div class="q-number">प्रश्न ${idx + 1}</div>`;

                    // Question text (English + Hindi)
                    html += `<div class="q-text">`;
                    html += `<span class="en"><span class="lang-tag">🇬🇧</span> ${q.qE || ''}</span>`;
                    html += `<span class="hi"><span class="lang-tag">🇮🇳</span> ${q.qH || ''}</span>`;
                    html += `</div>`;

                    // Options
                    html += `<div class="options">`;
                    const maxOpts = Math.max(enOpts.length, hiOpts.length);
                    for (let i = 0; i < maxOpts; i++) {
                        const isCorrect = (i === correctIndex);
                        const enText = enOpts[i] || '';
                        const hiText = hiOpts[i] || '';
                        html += `<div class="option-item${isCorrect ? ' correct' : ''}">`;
                        html += `<span class="opt-label">${optionLabels[i] || ''}</span>`;
                        html += `<span class="opt-en">${enText}</span>`;
                        if (hiText) {
                            html += `<span class="opt-hi"> / ${hiText}</span>`;
                        }
                        if (isCorrect) {
                            html += `<span class="correct-badge">✔ सही</span>`;
                        }
                        html += `</div>`;
                    }
                    html += `</div>`;

                    // Explicit correct answer (English + Hindi)
                    const correctEn = enOpts[correctIndex] || '';
                    const correctHi = hiOpts[correctIndex] || '';
                    html += `<div class="answer-hint">`;
                    html += `<strong>✅ सही उत्तर / Correct Answer:</strong>`;
                    html += ` <span>${correctEn}</span>`;
                    if (correctHi) {
                        html += ` <span style="color:#1a4a2a;"> / ${correctHi}</span>`;
                    }
                    html += `</div>`;

                    html += `</div>`;
                });

                container.innerHTML = html;
            }

            // ----- Event listeners -----
            yearSelect.addEventListener('change', function() {
                const year = this.value;
                if (year) {
                    loadModules(year);
                } else {
                    moduleSelect.innerHTML = '';
                    container.innerHTML = '<div class="empty-msg">कृपया एक वर्ष चुनें।</div>';
                    countSpan.textContent = 'प्रश्न: 0';
                }
            });

            moduleSelect.addEventListener('change', function() {
                const year = yearSelect.value;
                const moduleName = this.value;
                if (year && moduleName) {
                    loadQuestions(year, moduleName);
                }
            });

            // ----- Initial load (first year, first module) -----
            if (yearKeys.length > 0) {
                const firstYear = yearKeys[0];
                yearSelect.value = firstYear;
                loadModules(firstYear);
            } else {
                container.innerHTML = '<div class="empty-msg">कोई वर्ष उपलब्ध नहीं है।</div>';
            }
        }

        // If data already loaded, init directly, else wait for script to finish
        if (window.QUESTION_BANK && window.QUESTION_BANK.employability) {
            init();
        } else {
            // fallback: wait a bit (in case script loads asynchronously)
            const checkInterval = setInterval(() => {
                if (window.QUESTION_BANK && window.QUESTION_BANK.employability) {
                    clearInterval(checkInterval);
                    init();
                }
            }, 100);
            // safety timeout
            setTimeout(() => {
                clearInterval(checkInterval);
                if (!window.QUESTION_BANK || !window.QUESTION_BANK.employability) {
                    document.getElementById('questionsContainer').innerHTML =
                        '<div class="empty-msg">⏳ Data not loaded yet. Please refresh or check question-bank.js.</div>';
                }
            }, 5000);
        }
    })();
</script>

</body>
  </html>
